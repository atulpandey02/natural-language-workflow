# Local development topology.
#
# M1a: api + postgres + redis. The worker and scheduler services join in M1b to
# complete the five-service topology. Application containers are stateless;
# durable state lives in the postgres volume.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nlw
      POSTGRES_PASSWORD: nlw
      POSTGRES_DB: nlw
    # Published on 5433 to avoid colliding with a native Postgres on 5432.
    # In-cluster services still reach it at postgres:5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlw -d nlw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      DATABASE_URL: postgresql+psycopg://nlw:nlw@postgres:5432/nlw
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
