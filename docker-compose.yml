# Local development topology (M1b): five services.
#
#   postgres  — system of record (stateful; published on 5433)
#   redis     — queue transport only (ADR-002)
#   api       — FastAPI control plane
#   worker    — Dramatiq consumer (executes actors)
#   scheduler — heartbeat only for now (real scheduling in M8)
#
# The api/worker/scheduler roles are one image, selected by command, sharing one
# environment block. Application containers are stateless; only postgres (and
# its volume) is durable.

# The app runs as the restricted nlw_app role (RLS-enforced). Migrations run as
# the nlw owner via DATABASE_MIGRATION_URL, e.g.:
#   docker compose run --rm api alembic upgrade head
x-app-env: &app-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgresql+psycopg://nlw_app:nlw_app@postgres:5432/nlw
  DATABASE_MIGRATION_URL: postgresql+psycopg://nlw:nlw@postgres:5432/nlw
  REDIS_URL: redis://redis:6379/0
  # Supabase auth config, passed through from the host env (never committed).
  # Production target is JWKS via SUPABASE_URL; SUPABASE_JWT_SECRET is dev-only.
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nlw
      POSTGRES_PASSWORD: nlw
      POSTGRES_DB: nlw
    # Published on 5433 to avoid colliding with a native Postgres on 5432.
    # In-cluster services still reach it at postgres:5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Role bootstrap (creates the restricted nlw_app role on fresh volume init).
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlw -d nlw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # The planner runs in the API only. The platform LLM key is injected HERE
    # exclusively — never in the shared app-env block, so worker/scheduler never
    # receive it. Defaults keep the keyless stub provider for local dev.
    environment:
      <<: *app-env
      NLW_LLM_PROVIDER: ${NLW_LLM_PROVIDER:-stub}
      NLW_LLM_MODEL: ${NLW_LLM_MODEL:-claude-sonnet-5}
      NLW_LLM_API_KEY: ${NLW_LLM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["dramatiq", "nlw.worker.actors", "--processes", "1", "--threads", "4"]
    # The worker connects as nlw_worker (execution-only; may call the run->tenant
    # resolver). It never connects as nlw_app. Connector secrets are injected
    # here ONLY (never in api/scheduler/shared env) via a git-ignored env_file,
    # as tenant-scoped names: NLW_SECRET_<TENANT_UUID_HEX>_<SECRET_REF>=value.
    env_file:
      - path: docker/worker.secrets.env
        required: false
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://nlw_worker:nlw_worker@postgres:5432/nlw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dramatiq > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  scheduler:
    build: .
    command: ["python", "-m", "nlw.scheduler"]
    environment: *app-env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f nlw.scheduler > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
