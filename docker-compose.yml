# Local development topology (M1b): five services.
#
#   postgres  — system of record (stateful; published on 5433)
#   redis     — queue transport only (ADR-002)
#   api       — FastAPI control plane
#   worker    — Dramatiq consumer (executes actors)
#   scheduler — heartbeat only for now (real scheduling in M8)
#
# The api/worker/scheduler roles are one image, selected by command, sharing one
# environment block. Application containers are stateless; only postgres (and
# its volume) is durable.

# The app runs as the restricted nlw_app role (RLS-enforced). Migrations run as
# the nlw owner via DATABASE_MIGRATION_URL, e.g.:
#   docker compose run --rm api alembic upgrade head
x-app-env: &app-env
  APP_ENV: local
  LOG_LEVEL: info
  # Local development stack: demo tools (fake.*, static.*) are offered to new
  # planning EXPLICITLY. Unset = hidden (production/staging leave it unset).
  DEMO_TOOLS_ENABLED: "true"
  DATABASE_URL: postgresql+psycopg://nlw_app:nlw_app@postgres:5432/nlw
  DATABASE_MIGRATION_URL: postgresql+psycopg://nlw:nlw@postgres:5432/nlw
  REDIS_URL: redis://redis:6379/0
  # Supabase auth config, passed through from the host env (never committed).
  # Production target is JWKS via SUPABASE_URL; SUPABASE_JWT_SECRET is dev-only.
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}

# Container hardening (M9) applied to the stateless application roles only.
# NOT applied to postgres/redis, which need writable state volumes. The runtime
# constraints below (mem_limit/cpus/pids_limit, read_only, cap_drop,
# no-new-privileges) are honored by plain `docker compose up` (Compose v2), not
# only Swarm. The image already runs as the non-root appuser.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nlw
      POSTGRES_PASSWORD: nlw
      POSTGRES_DB: nlw
      # LOCAL-DEV ONLY defaults so a fresh dev volume initializes without a secret
      # file. These match the dev DATABASE_URLs below. Production requires strong
      # values (docker-compose.prod.yml fails without them); never weaken prod.
      NLW_APP_DB_PASSWORD: ${NLW_APP_DB_PASSWORD:-nlw_app}
      NLW_WORKER_DB_PASSWORD: ${NLW_WORKER_DB_PASSWORD:-nlw_worker}
      NLW_SCHEDULER_DB_PASSWORD: ${NLW_SCHEDULER_DB_PASSWORD:-nlw_scheduler}
    # Published on 5433 to avoid colliding with a native Postgres on 5432.
    # In-cluster services still reach it at postgres:5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Role bootstrap: creates the restricted runtime roles (nlw_app/nlw_worker/
      # nlw_scheduler) with the passwords above on fresh volume init.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlw -d nlw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    <<: *app-hardening
    # The planner runs in the API only. The platform LLM key is injected HERE
    # exclusively — never in the shared app-env block, so worker/scheduler never
    # receive it. Defaults keep the keyless stub provider for local dev.
    environment:
      <<: *app-env
      NLW_LLM_PROVIDER: ${NLW_LLM_PROVIDER:-stub}
      NLW_LLM_MODEL: ${NLW_LLM_MODEL:-claude-sonnet-5}
      NLW_LLM_API_KEY: ${NLW_LLM_API_KEY:-}
      # Signed DB context (P3B): the API signs with ITS key only (api class).
      # Key material is a mounted FILE (never an env value); see
      # scripts/ops/ctx-keys-dev.sh for local provisioning.
      NLW_CTX_KEY_ID: ${NLW_CTX_API_KEY_ID:-dev-api}
      NLW_CTX_KEY_FILE: /run/nlw/keys/api.key
    volumes:
      - ./docker/ctx-keys/api.key:/run/nlw/keys/api.key:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    <<: *app-hardening
    command: ["dramatiq", "nlw.worker.actors", "--processes", "1", "--threads", "4"]
    # The worker connects as nlw_worker (execution-only; may call the run->tenant
    # resolver). It never connects as nlw_app. Connector secrets are injected
    # here ONLY (never in api/scheduler/shared env) via a git-ignored env_file,
    # as tenant-scoped names: NLW_SECRET_<TENANT_UUID_HEX>_<SECRET_REF>=value.
    env_file:
      - path: docker/worker.secrets.env
        required: false
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://nlw_worker:nlw_worker@postgres:5432/nlw
      # Signed DB context (P3B): worker class key ONLY (cannot mint api contexts).
      NLW_CTX_KEY_ID: ${NLW_CTX_WORKER_KEY_ID:-dev-worker}
      NLW_CTX_KEY_FILE: /run/nlw/keys/worker.key
    volumes:
      - ./docker/ctx-keys/worker.key:/run/nlw/keys/worker.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Readiness beyond "process alive": DB + Redis reachable + metrics port up.
    healthcheck:
      test: ["CMD", "python", "-m", "nlw.ops.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    build: .
    <<: *app-hardening
    command: ["python", "-m", "nlw.scheduler"]
    # Connects as the least-privilege nlw_scheduler role. It receives NO
    # NLW_SECRET_* (worker-only), NO NLW_LLM_API_KEY (api-only), and NO connector
    # credentials — it only creates + enqueues runs.
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://nlw_scheduler:nlw_scheduler@postgres:5432/nlw
      # Signed DB context (P3B): scheduler class key ONLY (no human authority).
      NLW_CTX_KEY_ID: ${NLW_CTX_SCHEDULER_KEY_ID:-dev-scheduler}
      NLW_CTX_KEY_FILE: /run/nlw/keys/scheduler.key
    volumes:
      - ./docker/ctx-keys/scheduler.key:/run/nlw/keys/scheduler.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nlw.ops.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Next.js frontend + BFF (M10). The browser talks only to this service; its
  # server-side BFF injects the bearer token + X-Workspace-Id and calls the API
  # internally. Published on 3000 for local dev.
  web:
    build:
      context: ./web
    environment:
      NODE_ENV: production
      NLW_API_URL: http://api:8000
      # Runtime public config (browser-safe; server-injected into the document).
      # No NEXT_PUBLIC_* is baked into the build — one image serves any project.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVER_URL: ${SUPABASE_SERVER_URL:-}
      WORKSPACE_COOKIE_SECRET: ${WORKSPACE_COOKIE_SECRET:-dev-insecure-workspace-cookie-secret}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pgdata:
