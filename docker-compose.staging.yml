# M11 staging profile (overlay on docker-compose.prod.yml).
#
# Ephemeral/CI usage (HTTP edge, no public domain, deterministic):
#   docker compose -f docker-compose.prod.yml -f docker-compose.e2e.yml \
#     -f docker-compose.staging.yml up -d
#
# This overlay:
#   - sets APP_ENV=staging on the app services (docs off, prod-shaped),
#   - adds an internal Prometheus that scrapes each role's metrics port.
#
# Real-VPS staging uses docker-compose.prod.yml directly with a real
# PUBLIC_HOSTNAME + Caddy ACME TLS + APP_ENV=staging (see
# docs/staging/real-vps-checklist.md). CI (ephemeral) and VPS evidence are kept
# separate (D3).

services:
  api:
    environment:
      APP_ENV: staging
    # CI test-harness seam ONLY: expose the API on loopback so the host-side
    # seed / k6 / readiness checks can reach it. Production stays Caddy-only
    # public (this binding is 127.0.0.1 and lives only in the staging overlay).
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    environment:
      APP_ENV: staging
  scheduler:
    environment:
      APP_ENV: staging

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    # Runs as the image's non-root `nobody` user; both mounts are read-only.
    user: "65534:65534"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Every rule file referenced by prometheus.yml (`rule_files: alerts/*.yml`)
      # lives in this directory — mounted whole so a new rule file cannot be
      # referenced without being present (validated by tests + promtool).
      - ./docker/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    # Internal only — not published; queried from the drill/load tooling on the
    # internal network. (Publish 9090 locally only for manual inspection.)
    expose:
      - "9090"
    networks:
      - internal
    depends_on:
      - api
      - worker
      - scheduler
      - alertmanager

  # Alertmanager (M12A-Prep §K): internal only, null receiver until an operator
  # wires a real infrastructure channel (docs/ops/alerting.md). No public port.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"
    networks:
      - internal

volumes:
  prometheus_data:
  alertmanager_data:
