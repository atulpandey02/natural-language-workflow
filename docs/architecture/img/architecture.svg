<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Natural Language Workflow Platform system architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .h    { font-size:22px; font-weight:700; fill:#0f172a; }
      .sub  { font-size:12.5px; fill:#475569; }
      .band { font-size:12px; font-weight:700; fill:#64748b; letter-spacing:1.2px; }
      .title{ font-size:14px; font-weight:700; fill:#0f172a; }
      .body { font-size:11px; fill:#334155; }
      .mono { font-size:10.5px; fill:#475569; font-family:'SF Mono',Consolas,Menlo,monospace; }
      .chip { font-size:11px; font-weight:600; }
      .num  { font-size:11px; font-weight:700; fill:#ffffff; }
      .lg   { font-size:11px; fill:#334155; }
      .det  { fill:#ffffff; stroke:#334155; stroke-width:1.4; }
      .llm  { fill:#eff6ff; stroke:#2563eb; stroke-width:1.6; stroke-dasharray:7 4; }
      .state{ fill:#ecfdf5; stroke:#059669; stroke-width:2.6; }
      .redis{ fill:#fff7ed; stroke:#ea580c; stroke-width:1.8; }
      .ext  { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.4; stroke-dasharray:6 4; }
      .gate { fill:#fef2f2; stroke:#dc2626; stroke-width:1.8; }
      .cross{ fill:#f1f5f9; stroke:#64748b; stroke-width:1.4; }
      .flow { stroke:#475569; stroke-width:2; fill:none; }
      .flowA{ stroke:#2563eb; stroke-width:2.2; fill:none; }
      .dash { stroke:#94a3b8; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1400" height="1180" fill="#fbfcfe"/>
  <rect x="8" y="8" width="1384" height="1164" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header -->
  <text class="h" x="34" y="48">Natural Language Workflow Platform — System Architecture</text>
  <text class="sub" x="34" y="72">Users describe work in plain English · an LLM proposes a structured plan · deterministic Python validates and executes it durably — multi-tenant, idempotent, fully audited.</text>

  <!-- legend -->
  <g transform="translate(1010,22)">
    <rect x="0" y="0" width="358" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="14" y="12" width="20" height="13" rx="3" class="det"/>
    <text class="lg" x="40" y="22">Deterministic code (enforces)</text>
    <rect x="14" y="36" width="20" height="13" rx="3" class="llm"/>
    <text class="lg" x="40" y="46">LLM / model (reasons only)</text>
    <rect x="210" y="12" width="20" height="13" rx="3" class="state"/>
    <text class="lg" x="236" y="22">System of record</text>
    <rect x="210" y="36" width="20" height="13" rx="3" class="gate"/>
    <text class="lg" x="236" y="46">Human approval gate</text>
  </g>

  <!-- =================== BAND 1 : INGRESS =================== -->
  <text class="band" x="34" y="112">① INGRESS · CONTROL PLANE</text>
  <g>
    <rect x="34" y="122" width="250" height="62" rx="10" class="det"/>
    <text class="title" x="46" y="146">Browser · Next.js UI</text>
    <text class="body" x="46" y="165">Workflows · approvals · connectors</text>
    <text class="body" x="46" y="179">members &amp; invitations</text>

    <rect x="318" y="122" width="150" height="62" rx="10" class="det"/>
    <text class="title" x="330" y="146">Caddy</text>
    <text class="body" x="330" y="165">TLS reverse proxy</text>
    <text class="body" x="330" y="179">HTTPS · Let's Encrypt</text>

    <rect x="502" y="122" width="330" height="62" rx="10" class="det"/>
    <text class="title" x="514" y="146">FastAPI · api  (control plane)</text>
    <text class="body" x="514" y="165">Authn/authz · validation · planning · enqueues work</text>
    <text class="body" x="514" y="179">Never executes workflow steps</text>

    <rect x="866" y="122" width="240" height="62" rx="10" class="det"/>
    <text class="title" x="878" y="146">Supabase Auth</text>
    <text class="body" x="878" y="165">JWKS · RS256 / ES256</text>
    <text class="mono" x="878" y="179">verify_token → AuthedIdentity</text>

    <line class="flow" x1="284" y1="153" x2="316" y2="153" marker-end="url(#arrow)"/>
    <line class="flow" x1="468" y1="153" x2="500" y2="153" marker-end="url(#arrow)"/>
    <line class="dash" x1="832" y1="153" x2="864" y2="153" marker-end="url(#arrow)"/>
  </g>

  <!-- =================== BAND 2 : PLANNING =================== -->
  <rect x="30" y="206" width="1338" height="220" rx="12" fill="#f7fbff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text class="band" x="46" y="230">② AI PLANNING BOUNDARY — runs inside the api process · the platform LLM key never leaves it · the model never touches auth, tenancy, state or secrets</text>

  <!-- planner -->
  <rect x="52" y="252" width="212" height="120" rx="10" class="llm"/>
  <text class="title" x="64" y="276" fill="#1e3a8a">LLM Planner</text>
  <text class="body" x="64" y="296">BYOK · Anthropic reference</text>
  <text class="body" x="64" y="312">(keyless stub in CI)</text>
  <text class="mono" x="64" y="334">prompt → strict JSON plan</text>
  <text class="body" x="64" y="356">reasons; proposes; summarizes</text>

  <!-- planner output -->
  <rect x="300" y="252" width="180" height="120" rx="10" class="det"/>
  <text class="title" x="312" y="276">PlannerOutput</text>
  <text class="body" x="312" y="296">strict typed schema</text>
  <text class="body" x="312" y="312">steps · tools · args</text>
  <text class="body" x="312" y="328">dependency DAG</text>
  <text class="mono" x="312" y="352">contract-versioned</text>

  <!-- feasibility -->
  <rect x="516" y="244" width="262" height="136" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.4"/>
  <text class="title" x="528" y="268">Feasibility Engine</text>
  <text class="mono" x="528" y="285" fill="#0f172a">deterministic · pure Python</text>
  <text class="body" x="528" y="305">tool availability · connector ownership</text>
  <text class="body" x="528" y="321">argument models · SQL safety (sqlglot)</text>
  <text class="body" x="528" y="337">DAG check (Kahn) · platform limits</text>
  <text class="body" x="528" y="358">the LLM never approves its own plan</text>

  <!-- verdicts -->
  <g>
    <rect x="812" y="250" width="208" height="26" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text class="chip" x="822" y="268" fill="#047857">PASS → executable</text>
    <rect x="812" y="284" width="208" height="26" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text class="chip" x="822" y="302" fill="#b91c1c">NEEDS_APPROVAL</text>
    <rect x="812" y="318" width="208" height="26" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text class="chip" x="822" y="336" fill="#b45309">NEEDS_CLARIFICATION</text>
    <rect x="812" y="352" width="208" height="26" rx="6" fill="#f1f5f9" stroke="#64748b"/>
    <text class="chip" x="822" y="370" fill="#475569">REJECT (unsupported)</text>
  </g>

  <!-- audit + version -->
  <rect x="1050" y="250" width="298" height="58" rx="10" class="det"/>
  <text class="title" x="1062" y="272">plan_proposals</text>
  <text class="body" x="1062" y="291">immutable audit · no raw prompt / response stored</text>
  <text class="mono" x="1062" y="304" fill="#94a3b8">prompt_len only</text>

  <rect x="1050" y="320" width="298" height="58" rx="10" class="det"/>
  <text class="title" x="1062" y="342">workflow_version</text>
  <text class="body" x="1062" y="361">materialize re-earns PASS against live capability view</text>
  <text class="mono" x="1062" y="374" fill="#94a3b8">FOR UPDATE · idempotent</text>

  <!-- planning arrows -->
  <line class="flowA" x1="264" y1="312" x2="298" y2="312" marker-end="url(#arrowAccent)"/>
  <line class="flow"  x1="480" y1="312" x2="514" y2="312" marker-end="url(#arrow)"/>
  <line class="flow"  x1="778" y1="312" x2="810" y2="312" marker-end="url(#arrow)"/>
  <line class="flow"  x1="1020" y1="292" x2="1048" y2="279" marker-end="url(#arrow)"/>
  <!-- api -> planner (1) -->
  <path class="flowA" d="M600 184 L600 200 L158 200 L158 250" marker-end="url(#arrowAccent)"/>
  <circle cx="158" cy="216" r="11" fill="#2563eb"/><text class="num" x="154" y="220">1</text>

  <!-- =================== BAND 3 : STATE =================== -->
  <text class="band" x="34" y="456">③ SYSTEM OF RECORD</text>

  <rect x="360" y="466" width="470" height="168" rx="12" class="state"/>
  <text class="title" x="378" y="492" fill="#065f46">PostgreSQL — system of record</text>
  <text class="body" x="378" y="514">Row-Level Security · signed, expiring HMAC context (ADR-024)</text>
  <text class="body" x="378" y="532">51 policies trust only verified accessors · nlw_app has no BYPASSRLS</text>
  <text class="body" x="378" y="550">per-tenant isolation enforced in the database, never by the model</text>
  <text class="mono" x="378" y="574" fill="#065f46">runs · steps · approvals · schedules · connectors</text>
  <text class="mono" x="378" y="590" fill="#065f46">external_actions · memberships · invitations · authz_audit</text>
  <text class="body" x="378" y="614">20 Alembic migrations · owner-only DDL · restore-validated</text>

  <rect x="864" y="486" width="244" height="128" rx="12" class="redis"/>
  <text class="title" x="878" y="510" fill="#9a3412">Redis + Dramatiq</text>
  <text class="body" x="878" y="532">queue transport ONLY</text>
  <text class="body" x="878" y="550">carries run_ids, not state</text>
  <text class="body" x="878" y="574">losing Redis loses</text>
  <text class="body" x="878" y="590">no workflow state</text>
  <text class="mono" x="878" y="608" fill="#9a3412">at-least-once delivery</text>

  <!-- feasibility/api -> postgres (persist) -->
  <path class="flow" d="M640 380 L640 464" marker-end="url(#arrow)"/>
  <circle cx="640" cy="424" r="11" fill="#475569"/><text class="num" x="636" y="428">4</text>
  <text class="mono" x="654" y="428" fill="#475569">persist plan · version · run</text>

  <!-- postgres -> redis : enqueue run_id after commit -->
  <line class="flow" x1="831" y1="536" x2="862" y2="536" marker-end="url(#arrow)"/>
  <text class="mono" x="864" y="480" fill="#475569">⑤ enqueue run_id · after commit</text>

  <!-- =================== BAND 4 : EXECUTION =================== -->
  <text class="band" x="34" y="672">④ EXECUTION PLANE  (stateless · one image · least-privilege DB roles)</text>

  <rect x="360" y="686" width="330" height="150" rx="12" class="det"/>
  <text class="title" x="376" y="710">Worker — durable executor</text>
  <text class="mono" x="376" y="728" fill="#475569">advance_run(run_id): one step / txn</text>
  <text class="body" x="376" y="748">FOR UPDATE serialization · commit-before-enqueue</text>
  <text class="body" x="376" y="766">idempotent replay · crash-safe resume (M7)</text>
  <text class="body" x="376" y="784">ambiguous side effect → terminal ACTION_OUTCOME_UNKNOWN</text>
  <text class="body" x="376" y="806">resolves tenant via worker-only SECURITY DEFINER</text>
  <text class="mono" x="376" y="826" fill="#475569">connects as nlw_worker (NOBYPASSRLS)</text>

  <rect x="720" y="686" width="330" height="150" rx="12" class="det"/>
  <text class="title" x="736" y="710">Scheduler — due-scan + reconcile</text>
  <text class="mono" x="736" y="728" fill="#475569">FOR UPDATE SKIP LOCKED</text>
  <text class="body" x="736" y="748">structured schedules (IANA tz, no cron)</text>
  <text class="body" x="736" y="766">exactly one run per occurrence</text>
  <text class="mono" x="736" y="784" fill="#475569">UNIQUE(schedule_id, scheduled_for)</text>
  <text class="body" x="736" y="804">re-drives stuck runs · per-tenant fairness cap</text>
  <text class="mono" x="736" y="826" fill="#475569">connects as nlw_scheduler</text>

  <!-- redis -> worker (6) -->
  <path class="flow" d="M900 614 L900 660 L560 660 L560 684" marker-end="url(#arrow)"/>
  <circle cx="560" cy="660" r="11" fill="#475569"/><text class="num" x="556" y="664">6</text>
  <!-- worker <-> postgres (7) -->
  <path class="flow" d="M470 686 L470 634" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <circle cx="470" cy="660" r="11" fill="#475569"/><text class="num" x="466" y="664">7</text>
  <text class="mono" x="484" y="664" fill="#475569">load state · checkpoint</text>
  <!-- scheduler <-> postgres (9) -->
  <path class="flow" d="M760 686 L760 634" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <circle cx="760" cy="660" r="11" fill="#475569"/><text class="num" x="756" y="664">9</text>
  <!-- scheduler -> redis -->
  <path class="dash" d="M1000 686 L1000 620" marker-end="url(#arrow)"/>
  <text class="mono" x="1010" y="648" fill="#94a3b8">enqueue</text>

  <!-- =================== BAND 5 : CAPABILITY =================== -->
  <text class="band" x="34" y="878">⑤ CAPABILITY LAYER  (only registered tools run · secrets resolved worker-side · side effects gated)</text>

  <rect x="34" y="892" width="196" height="128" rx="10" class="det"/>
  <text class="title" x="46" y="916">Tool Registry</text>
  <text class="body" x="46" y="937">static ToolSpecs</text>
  <text class="body" x="46" y="955">only registered tools run</text>
  <text class="body" x="46" y="978">unknown tool ⇒</text>
  <text class="body" x="46" y="994">fails feasibility</text>
  <text class="mono" x="46" y="1013" fill="#94a3b8">no LLM-generated code</text>

  <rect x="248" y="892" width="210" height="128" rx="10" class="det"/>
  <text class="title" x="260" y="916">SecretStore</text>
  <text class="body" x="260" y="937">credential refs live in DB</text>
  <text class="body" x="260" y="955">values resolved worker-side</text>
  <text class="body" x="260" y="973">at execution time only</text>
  <text class="body" x="260" y="997">never in prompts,</text>
  <text class="mono" x="260" y="1015" fill="#94a3b8">logs, traces or plans</text>

  <rect x="476" y="892" width="182" height="128" rx="10" class="gate"/>
  <text class="title" x="488" y="916" fill="#991b1b">Approval gate</text>
  <text class="body" x="488" y="937">side-effect steps park</text>
  <text class="mono" x="488" y="954" fill="#991b1b">WAITING_APPROVAL</text>
  <text class="body" x="488" y="976">admin/owner · four-eyes</text>
  <text class="body" x="488" y="994">(requester ≠ decider)</text>
  <text class="body" x="488" y="1013">CAS &amp; recovery-safe</text>

  <rect x="676" y="892" width="300" height="128" rx="10" class="det"/>
  <text class="title" x="688" y="916">Connectors</text>
  <text class="body" x="688" y="937">postgres.query — read-only (sqlglot · RO role · timeouts · caps)</text>
  <text class="body" x="688" y="957">webhook.send · slack.send_message — at-least-once</text>
  <text class="body" x="688" y="977">two-txn lease: claim → COMMIT → call → finalize</text>
  <text class="body" x="688" y="997">identity-pinned (connector config fingerprint)</text>
  <text class="mono" x="688" y="1015" fill="#94a3b8">stale plan on connector drift</text>

  <rect x="994" y="892" width="352" height="128" rx="10" class="ext"/>
  <text class="title" x="1008" y="916">External systems  (tenant-owned)</text>
  <text class="body" x="1008" y="939">Tenant PostgreSQL — read-only, allowlisted</text>
  <text class="body" x="1008" y="959">Slack API</text>
  <text class="body" x="1008" y="979">Webhooks — HTTPS-only, redirect-disabled</text>
  <text class="body" x="1008" y="999">SSRF-guarded · connect-time IP validation</text>
  <text class="mono" x="1008" y="1017" fill="#94a3b8">DNS-rebinding-safe pinning</text>

  <!-- worker -> capability chain (8) -->
  <path class="flow" d="M420 836 L420 866 L132 866 L132 890" marker-end="url(#arrow)"/>
  <circle cx="132" cy="866" r="11" fill="#475569"/><text class="num" x="128" y="870">8</text>
  <text class="mono" x="146" y="870" fill="#475569">dispatch step · resolve connector + secret</text>
  <line class="flow" x1="230" y1="956" x2="246" y2="956" marker-end="url(#arrow)"/>
  <line class="flow" x1="458" y1="956" x2="474" y2="956" marker-end="url(#arrow)"/>
  <line class="flow" x1="658" y1="956" x2="674" y2="956" marker-end="url(#arrow)"/>
  <line class="flow" x1="976" y1="956" x2="992" y2="956" marker-end="url(#arrow)"/>

  <!-- =================== BAND 6 : CROSS-CUTTING =================== -->
  <text class="band" x="34" y="1058">CROSS-CUTTING · OPERATIONS</text>
  <rect x="34" y="1070" width="420" height="86" rx="10" class="cross"/>
  <text class="title" x="48" y="1094">Observability</text>
  <text class="body" x="48" y="1114">structlog (JSON) · OpenTelemetry spans</text>
  <text class="body" x="48" y="1132">Prometheus + Alertmanager</text>
  <text class="body" x="48" y="1150">request ↔ run ↔ step correlation ids</text>

  <rect x="470" y="1070" width="420" height="86" rx="10" class="cross"/>
  <text class="title" x="484" y="1094">Backup &amp; disaster recovery</text>
  <text class="body" x="484" y="1114">restic encrypted, off-host snapshots</text>
  <text class="body" x="484" y="1132">taken &amp; verified before every migration</text>
  <text class="body" x="484" y="1150">restore-validated through schema 0020</text>

  <rect x="906" y="1070" width="440" height="86" rx="10" class="cross"/>
  <text class="title" x="920" y="1094">Release provenance &amp; rollout</text>
  <text class="body" x="920" y="1114">GitHub artifact attestation · SLSA provenance</text>
  <text class="body" x="920" y="1132">immutable GHCR image digests</text>
  <text class="body" x="920" y="1150">phased, gated, read-only-by-default deploy</text>
</svg>
