# M11 staging validation (ephemeral CI evidence).
#
# Prod-shaped topology (D3): the application + web IMAGES are built once and tagged
# for this commit, then docker-compose.prod.yml (+ e2e/staging overlays) runs those
# exact images with NO --build. Real VPS/production uses immutable GHCR digests;
# the commit-SHA tags are the ephemeral-CI equivalent. Required gates (drills, k6
# safe-target, backup/restore, schema/readiness drill) FAIL the job if they fail.
# Ephemeral-CI and real-VPS evidence are kept separate; a real-VPS pass remains
# required before M12. Third-party actions are SHA-pinned (risk H).

name: Staging Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # nightly
  # PR-triggered but LABEL-GATED: the expensive Tier-2 job runs on a PR only when
  # it carries the "staging-validation" label (so M11 Tier-2 can run before merge).
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Staging drills + capacity + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # schedule/workflow_dispatch always run; PRs only with the gate label.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'staging-validation')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0

      - name: Start Supabase
        run: |
          supabase --version
          supabase init --force >/dev/null 2>&1 || true
          supabase start
          supabase status -o env | tee supabase.env
          API_URL="$(grep ^API_URL supabase.env | cut -d= -f2- | tr -d '\"')"
          {
            echo "SUPABASE_API_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=$(grep ^ANON_KEY supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep ^SERVICE_ROLE_KEY supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_JWT_SECRET=$(grep ^JWT_SECRET supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_JWT_ISSUER=${API_URL}/auth/v1"
            echo "SUPABASE_JWKS_URL=http://host.docker.internal:54321/auth/v1/.well-known/jwks.json"
          } >> "$GITHUB_ENV"

      - name: Build application + web images once (tag by commit)
        run: |
          APP="nlw-staging:${GITHUB_SHA}"
          WEB="nlw-web-staging:${GITHUB_SHA}"
          docker build -t "$APP" .
          # No Supabase build-args: the web image is environment-agnostic and takes
          # its public config at RUNTIME (server-injected). Same digest for any env.
          docker build -t "$WEB" web
          echo "NLW_IMAGE=$APP" >> "$GITHUB_ENV"
          echo "NLW_WEB_IMAGE=$WEB" >> "$GITHUB_ENV"

      - name: Configure prod-shaped staging env
        run: |
          # Synthetic CI-ONLY strong role passwords (URL-safe). These exercise the
          # exact new bootstrap path (00-roles.sh) and prove NO weak default is
          # used; each per-role URL embeds its OWN role's password (no fallback).
          OWNER_PW="ci_owner_$(openssl rand -hex 16)"
          APP_PW="ci_app_$(openssl rand -hex 16)"
          WORKER_PW="ci_worker_$(openssl rand -hex 16)"
          SCHED_PW="ci_scheduler_$(openssl rand -hex 16)"
          for v in "$OWNER_PW" "$APP_PW" "$WORKER_PW" "$SCHED_PW"; do echo "::add-mask::$v"; done
          {
            echo "COMPOSE=docker compose -f docker-compose.prod.yml -f docker-compose.e2e.yml -f docker-compose.staging.yml"
            echo "POSTGRES_PASSWORD=${OWNER_PW}"
            echo "NLW_APP_DB_PASSWORD=${APP_PW}"
            echo "NLW_WORKER_DB_PASSWORD=${WORKER_PW}"
            echo "NLW_SCHEDULER_DB_PASSWORD=${SCHED_PW}"
            echo "DATABASE_URL=postgresql+psycopg://nlw_app:${APP_PW}@postgres:5432/nlw"
            echo "DATABASE_MIGRATION_URL=postgresql+psycopg://nlw:${OWNER_PW}@postgres:5432/nlw"
            echo "WORKER_DATABASE_URL=postgresql+psycopg://nlw_worker:${WORKER_PW}@postgres:5432/nlw"
            echo "SCHEDULER_DATABASE_URL=postgresql+psycopg://nlw_scheduler:${SCHED_PW}@postgres:5432/nlw"
            echo "REDIS_URL=redis://redis:6379/0"
            echo "PUBLIC_HOSTNAME=localhost"
            # Runtime public config for the web container (browser-safe). The web
            # image is env-agnostic; the browser reaches Supabase at this PUBLIC
            # URL while the e2e overlay sets SUPABASE_SERVER_URL for the container.
            echo "SUPABASE_URL=${SUPABASE_API_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "WORKSPACE_COOKIE_SECRET=staging-validation-cookie-secret"
            # Capacity phase: raise limits so k6 measures the knee, not 429s.
            echo "RATE_LIMIT_PLANS_PER_MIN=100000"
            echo "RATE_LIMIT_WRITES_PER_MIN=100000"
          } >> "$GITHUB_ENV"

      - name: Bring up staging profile (datastores -> migrate -> runtime; NO --build)
        run: |
          $COMPOSE up -d postgres redis
          for i in $(seq 1 60); do $COMPOSE exec -T postgres pg_isready -U nlw -d nlw && break; sleep 2; done
          # Migrations run in the dedicated one-shot migrate service (owner cred is
          # NOT in api/worker/scheduler). --profile migration includes that service.
          $COMPOSE --profile migration run --rm migrate
          $COMPOSE up -d api worker scheduler web caddy prometheus
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/login >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health/ready

      - name: Seed fixtures (users, workspaces, membership, workflow)
        env:
          SUPABASE_API_URL: ${{ env.SUPABASE_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NLW_API_BASE: http://127.0.0.1:8000
        run: node web/e2e/seed.mjs >> "$GITHUB_ENV"

      - name: Seed load credentials (K6 token/workspace, tenant A/B)
        env:
          SUPABASE_API_URL: ${{ env.SUPABASE_API_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NLW_API_BASE: http://127.0.0.1:8000
        run: node tests/load/seed_staging.mjs

      - name: Verify credentials + DB roles (api/worker/scheduler)
        run: |
          test -n "$K6_ADMIN_TOKEN" || { echo "K6_ADMIN_TOKEN empty"; exit 1; }
          test -n "$K6_WORKSPACE" || { echo "K6_WORKSPACE empty"; exit 1; }
          # Trigger a run so the worker actually connects, then inspect roles.
          curl -fsS -X POST "http://127.0.0.1:8000/workflows/${TENANT_A_WORKFLOW_ID}/runs" \
            -H "Authorization: Bearer $K6_ADMIN_TOKEN" -H "X-Workspace-Id: $K6_WORKSPACE" \
            -H "Idempotency-Key: role-check-1" -H "Content-Type: application/json" >/dev/null || true
          sleep 5
          roles=$($COMPOSE exec -T postgres psql -U nlw -d nlw -tAc \
            "SELECT string_agg(DISTINCT usename, ',') FROM pg_stat_activity WHERE usename LIKE 'nlw%'")
          echo "active DB roles: $roles"
          for r in nlw_app nlw_worker nlw_scheduler; do
            echo "$roles" | grep -q "$r" || { echo "FAIL: role $r not observed"; exit 1; }
          done

      - name: Assert rate limits RAISED (capacity phase)
        run: |
          got429=0
          for i in $(seq 1 30); do
            c=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/plans \
              -H "Authorization: Bearer $K6_ADMIN_TOKEN" -H "X-Workspace-Id: $K6_WORKSPACE" \
              -H "Content-Type: application/json" -d '{"prompt":"limit probe"}')
            [ "$c" = "429" ] && got429=1
          done
          [ "$got429" = "0" ] || { echo "FAIL: got 429 while limits should be raised"; exit 1; }
          echo "confirmed: no 429 with raised limits"

      - name: Failure drills (A/B/C/D)  # GATING
        env:
          COMPOSE: ${{ env.COMPOSE }}
          # readiness is an API endpoint (loopback :8000), not the web edge (:8080).
          API: http://127.0.0.1:8000
        run: tests/drills/run_drills.sh

      - name: k6 capacity — safe target (GATING thresholds)
        run: |
          docker run --rm --network host \
            -e K6_BASE_URL=http://127.0.0.1:8000 -e K6_TOKEN="$K6_ADMIN_TOKEN" \
            -e K6_WORKSPACE="$K6_WORKSPACE" -v "$PWD/tests/load:/scripts" \
            grafana/k6:0.54.0 run /scripts/control-plane.js

      - name: Restore NORMAL rate limits + recreate API
        run: |
          RATE_LIMIT_PLANS_PER_MIN=20 RATE_LIMIT_WRITES_PER_MIN=60 \
            $COMPOSE up -d --force-recreate api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1 && break; sleep 2; done

      - name: Assert rate limits NORMAL (config actually changed)
        run: |
          got429=0
          for i in $(seq 1 40); do
            c=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/plans \
              -H "Authorization: Bearer $K6_ADMIN_TOKEN" -H "X-Workspace-Id: $K6_WORKSPACE" \
              -H "Content-Type: application/json" -d '{"prompt":"limit probe"}')
            [ "$c" = "429" ] && got429=1
          done
          [ "$got429" = "1" ] || { echo "FAIL: expected 429 under normal limits"; exit 1; }
          echo "confirmed: 429 observed under normal limits (phase changed)"

      - name: k6 rate-limit (normal limits; GATING)
        run: |
          docker run --rm --network host \
            -e K6_BASE_URL=http://127.0.0.1:8000 -e K6_TOKEN="$K6_ADMIN_TOKEN" \
            -e K6_WORKSPACE="$K6_WORKSPACE" -v "$PWD/tests/load:/scripts" \
            grafana/k6:0.54.0 run /scripts/rate-limit.js

      - name: Required Playwright E2E against staging
        working-directory: web
        env:
          E2E_REQUIRED: "1"
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Backup / restore drill (GATING)
        env:
          COMPOSE: ${{ env.COMPOSE }}
        run: bash tests/drills/backup_restore_drill.sh

      - name: Schema-incompatibility / readiness drill (GATING)
        env:
          COMPOSE: ${{ env.COMPOSE }}
          # readiness (schema check) is an API endpoint on loopback :8000.
          API: http://127.0.0.1:8000
        run: bash tests/drills/migration_drill.sh

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          curl -s http://127.0.0.1:8000/metrics > artifacts/api-metrics.txt 2>/dev/null || true
          $COMPOSE ps > artifacts/compose-ps.txt 2>/dev/null || true
          docker stats --no-stream > artifacts/docker-stats.txt 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-validation-evidence
          path: artifacts/

      - name: Tear down
        if: always()
        run: |
          $COMPOSE down -v || true
          supabase stop || true
