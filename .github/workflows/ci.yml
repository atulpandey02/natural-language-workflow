name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, type, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration"

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12"
      - run: uv sync --frozen
      - run: uv run pytest -m integration

  migrations:
    name: Alembic upgrade on clean DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nlw
          POSTGRES_PASSWORD: nlw
          POSTGRES_DB: nlw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlw -d nlw"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12"
      - run: uv sync --frozen
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://nlw:nlw@localhost:5432/nlw
        run: uv run alembic upgrade head

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nlw:ci

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12"
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt > requirements.txt
          uvx pip-audit -r requirements.txt
