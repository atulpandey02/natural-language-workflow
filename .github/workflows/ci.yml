name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, type, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration"

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12"
      - run: uv sync --frozen
      - run: uv run pytest -m integration

  migrations:
    name: Alembic upgrade on clean DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nlw
          POSTGRES_PASSWORD: nlw
          POSTGRES_DB: nlw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlw -d nlw"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12"
      - run: uv sync --frozen
      - name: Bootstrap runtime roles (bootstrap, not a migration)
        env:
          OWNER_URL: postgresql://nlw:nlw@localhost:5432/nlw
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["OWNER_URL"], autocommit=True) as conn:
              conn.execute(
                  "DO $$ BEGIN "
                  "IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='nlw_app') THEN "
                  "CREATE ROLE nlw_app LOGIN PASSWORD 'nlw_app' "
                  "NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT; END IF; "
                  "IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='nlw_worker') THEN "
                  "CREATE ROLE nlw_worker LOGIN PASSWORD 'nlw_worker' "
                  "NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT; END IF; "
                  "IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='nlw_scheduler') THEN "
                  "CREATE ROLE nlw_scheduler LOGIN PASSWORD 'nlw_scheduler' "
                  "NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT; END IF; "
                  "IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='nlw_rls_bypass') THEN "
                  "CREATE ROLE nlw_rls_bypass NOLOGIN NOSUPERUSER BYPASSRLS "
                  "NOCREATEDB NOCREATEROLE; END IF; "
                  "IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='nlw_workspace_bootstrap') THEN "
                  "CREATE ROLE nlw_workspace_bootstrap NOLOGIN NOSUPERUSER BYPASSRLS "
                  "NOCREATEDB NOCREATEROLE; END IF; "
                  "IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='nlw_membership_admin') THEN "
                  "CREATE ROLE nlw_membership_admin NOLOGIN NOSUPERUSER BYPASSRLS "
                  "NOCREATEDB NOCREATEROLE; END IF; "
                  "IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='nlw_ctx_verifier') THEN "
                  "CREATE ROLE nlw_ctx_verifier NOLOGIN NOSUPERUSER NOBYPASSRLS "
                  "NOCREATEDB NOCREATEROLE; END IF; END $$;"
              )
              for role in ("nlw_app", "nlw_worker", "nlw_scheduler"):
                  conn.execute(f"GRANT CONNECT ON DATABASE nlw TO {role}")
                  conn.execute(f"GRANT USAGE ON SCHEMA public TO {role}")
              conn.execute("GRANT nlw_rls_bypass TO nlw")
              conn.execute("GRANT nlw_workspace_bootstrap TO nlw")
              conn.execute("GRANT nlw_membership_admin TO nlw")
              conn.execute("GRANT nlw_ctx_verifier TO nlw")
          PY
      - name: Apply migrations (as owner)
        env:
          DATABASE_MIGRATION_URL: postgresql+psycopg://nlw:nlw@localhost:5432/nlw
        run: uv run alembic upgrade head

  # NOTE (M9): third-party actions below should be pinned to immutable commit
  # SHAs before staging go-live (ADR-018). They are left on major-version tags
  # here so CI keeps working across environments; the deploy pipeline (staging
  # workflow) is where SHA pinning is enforced.
  docker-build:
    name: Docker image builds + scan + compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: nlw:ci
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nlw:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          push: false
          load: true
          tags: nlw-web:ci
          # No Supabase build-args: the image is environment-agnostic (public
          # config is supplied at runtime, server-injected into the document).
      - name: Trivy scan (frontend image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nlw-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
      - name: Validate dev compose config
        env:
          SUPABASE_URL: https://proj.supabase.co
          SUPABASE_ANON_KEY: ci-anon
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Production compose FAILS without required secrets (negative)
        env:
          NLW_IMAGE: nlw:ci
          NLW_WEB_IMAGE: nlw-web:ci
          PUBLIC_HOSTNAME: staging.example.com
          DATABASE_URL: postgresql+psycopg://nlw_app:x@postgres:5432/nlw
          WORKER_DATABASE_URL: postgresql+psycopg://nlw_worker:x@postgres:5432/nlw
          SCHEDULER_DATABASE_URL: postgresql+psycopg://nlw_scheduler:x@postgres:5432/nlw
          DATABASE_MIGRATION_URL: postgresql+psycopg://nlw:x@postgres:5432/nlw
          REDIS_URL: redis://redis:6379/0
          SUPABASE_URL: https://proj.supabase.co
          SUPABASE_ANON_KEY: ci-anon
          WORKSPACE_COOKIE_SECRET: ci-secret
          POSTGRES_PASSWORD: x
          # All three role passwords are provided; the loop below removes exactly
          # ONE at a time, so compose can only fail on THAT variable (deterministic,
          # order-independent — unlike leaving all three unset at once).
          NLW_APP_DB_PASSWORD: ci-app-pw
          NLW_WORKER_DB_PASSWORD: ci-worker-pw
          NLW_SCHEDULER_DB_PASSWORD: ci-scheduler-pw
        run: |
          # Render-required secrets: removing any ONE must fail the render with a
          # message naming that variable. (DATABASE_MIGRATION_URL is intentionally
          # NOT here: it is runtime-guarded in the one-shot migrate service so a
          # normal runtime `up` never needs it — see the separate check below.)
          for var in POSTGRES_PASSWORD NLW_APP_DB_PASSWORD NLW_WORKER_DB_PASSWORD NLW_SCHEDULER_DB_PASSWORD WORKSPACE_COOKIE_SECRET; do
            if env -u "$var" docker compose -f docker-compose.prod.yml config >/dev/null 2>err.txt; then
              echo "FAIL: prod compose rendered without $var"; cat err.txt; exit 1
            fi
            grep -q "$var is required" err.txt \
              || { echo "FAIL: expected missing-$var error"; cat err.txt; exit 1; }
            echo "OK: prod compose fails fast without $var"
          done
          # A plain runtime render (no migration profile) must SUCCEED without the
          # owner credential — runtime services never receive DATABASE_MIGRATION_URL.
          env -u DATABASE_MIGRATION_URL docker compose -f docker-compose.prod.yml config >/dev/null \
            || { echo "FAIL: runtime render should not require DATABASE_MIGRATION_URL"; exit 1; }
          echo "OK: runtime render does not require the migration credential"
          # And the migration credential appears ONLY in the migrate service.
          holders=$(docker compose -f docker-compose.prod.yml --profile migration config \
            | python3 -c 'import sys,yaml;c=yaml.safe_load(sys.stdin);print(" ".join(n for n,s in c["services"].items() if "DATABASE_MIGRATION_URL" in (s.get("environment") or {})))')
          [ "$holders" = "migrate" ] || { echo "FAIL: DATABASE_MIGRATION_URL holders = '$holders' (want: migrate)"; exit 1; }
          echo "OK: DATABASE_MIGRATION_URL is isolated to the migrate service"
      - name: Validate production compose config (complete env)
        env:
          NLW_IMAGE: nlw:ci
          NLW_WEB_IMAGE: nlw-web:ci
          PUBLIC_HOSTNAME: staging.example.com
          POSTGRES_PASSWORD: ci-owner-pw
          NLW_APP_DB_PASSWORD: ci-app-pw
          NLW_WORKER_DB_PASSWORD: ci-worker-pw
          NLW_SCHEDULER_DB_PASSWORD: ci-scheduler-pw
          DATABASE_URL: postgresql+psycopg://nlw_app:ci-app-pw@postgres:5432/nlw
          WORKER_DATABASE_URL: postgresql+psycopg://nlw_worker:ci-worker-pw@postgres:5432/nlw
          SCHEDULER_DATABASE_URL: postgresql+psycopg://nlw_scheduler:ci-scheduler-pw@postgres:5432/nlw
          DATABASE_MIGRATION_URL: postgresql+psycopg://nlw:ci-owner-pw@postgres:5432/nlw
          REDIS_URL: redis://redis:6379/0
          SUPABASE_URL: https://proj.supabase.co
          SUPABASE_ANON_KEY: ci-anon
          WORKSPACE_COOKIE_SECRET: ci-secret
        run: docker compose -f docker-compose.prod.yml --profile migration config >/dev/null

  web:
    name: Frontend (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          # Runtime env (not baked). Provided so any server evaluation during the
          # build has valid values; the browser bundle contains no NEXT_PUBLIC_*.
          SUPABASE_URL: https://proj.supabase.co
          SUPABASE_ANON_KEY: ci-anon

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12"
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt > requirements.txt
          uvx pip-audit -r requirements.txt
