# Required end-to-end job (M10 gate): runs Playwright against a fully seeded
# stack — Supabase auth + backend + worker + scheduler + web + Caddy — in
# REQUIRED mode (E2E_REQUIRED=1), so a missing/broken stack FAILS the job
# instead of silently skipping.
#
# NOTE: third-party actions should be pinned to immutable commit SHAs before
# go-live (ADR-018 policy); left on tags here for readability.

name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Required Playwright E2E (seeded stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 1) Local Supabase (GoTrue + Postgres) for real cookie auth. The CLI is
      #    PINNED for reproducible local-auth behavior (recent versions sign local
      #    user tokens asymmetrically — which is the production-target JWKS path).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Supabase
        run: |
          supabase --version
          supabase init --force >/dev/null 2>&1 || true
          supabase start
          supabase status -o env | tee supabase.env
          API_URL="$(grep ^API_URL supabase.env | cut -d= -f2- | tr -d '\"')"
          # Export the values the stack + seed need.
          {
            echo "SUPABASE_API_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=$(grep ^ANON_KEY supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep ^SERVICE_ROLE_KEY supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_JWT_SECRET=$(grep ^JWT_SECRET supabase.env | cut -d= -f2- | tr -d '\"')"
            # Token `iss` is the host-side URL; JWKS must be fetched from the API
            # container via the host gateway (different host, same port).
            echo "SUPABASE_JWT_ISSUER=${API_URL}/auth/v1"
            echo "SUPABASE_JWKS_URL=http://host.docker.internal:54321/auth/v1/.well-known/jwks.json"
          } >> "$GITHUB_ENV"

      # 2) Bring up the stack in production migration order: datastores first,
      #    schema migrated, THEN runtime processes (so the scheduler never queries
      #    tables before they exist).
      - name: Build + start stack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          # JWKS-first verification (asymmetric); HS256 secret kept as fallback.
          SUPABASE_JWT_SECRET: ${{ env.SUPABASE_JWT_SECRET }}
          SUPABASE_JWKS_URL: ${{ env.SUPABASE_JWKS_URL }}
          SUPABASE_JWT_ISSUER: ${{ env.SUPABASE_JWT_ISSUER }}
          WORKSPACE_COOKIE_SECRET: e2e-workspace-cookie-secret-please-change
          # Pre-provisioned tenant-scoped worker secret is injected via the
          # seed-provisioned worker.secrets.env (see seed step output).
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.e2e.yml"
          # a) datastores only
          $COMPOSE up -d postgres redis
          # b) wait for Postgres readiness
          for i in $(seq 1 60); do
            $COMPOSE exec -T postgres pg_isready -U nlw -d nlw && break; sleep 2;
          done
          # c) schema first — migrate before any runtime process starts
          $COMPOSE run --rm api alembic upgrade head
          # d) now start the runtime processes
          $COMPOSE up -d --build api worker scheduler web caddy
          # e) wait for FastAPI readiness (Postgres + Redis + schema) BEFORE seeding.
          #    Use the loopback IPv4 literal to avoid ::1/localhost ambiguity in CI.
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::FastAPI did not become ready in time"
            $COMPOSE ps
            $COMPOSE logs api --tail=200
            exit 1
          fi
          # f) independently wait for the public frontend edge (Caddy -> Next).
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Frontend edge did not become ready in time"
            $COMPOSE ps
            $COMPOSE logs caddy web --tail=200
            exit 1
          fi

      # 2b) Prove the API container can reach the Supabase JWKS endpoint BEFORE
      #     seeding — surfaces asymmetric-verification connectivity problems here
      #     rather than as an opaque 401 from /me.
      - name: JWKS preflight (from API container)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.e2e.yml"
          if ! $COMPOSE exec -T api python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://host.docker.internal:54321/auth/v1/.well-known/jwks.json', timeout=5).status==200 else 1)"; then
            echo "::error::API container cannot reach the Supabase JWKS endpoint"
            $COMPOSE exec -T api python -c "import socket; print('host.docker.internal ->', socket.gethostbyname('host.docker.internal'))" || true
            $COMPOSE logs api --tail=100
            exit 1
          fi
          echo "JWKS reachable from the API container."

      # 3) Seed: two Supabase users, two workspaces, a member membership, and the
      #    tenant-scoped worker secret required by the connector.
      - name: Seed the stack
        id: seed
        env:
          SUPABASE_API_URL: ${{ env.SUPABASE_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          # Loopback IPv4 literal (not localhost) to avoid ::1/IPv6 ambiguity.
          NLW_API_BASE: http://127.0.0.1:8000
        # Write the synthetic E2E credentials to $GITHUB_ENV WITHOUT echoing them
        # to the workflow logs.
        run: node web/e2e/seed.mjs >> "$GITHUB_ENV"

      # 4) Run the required E2E suite through the public Caddy edge.
      - name: Install Playwright browsers
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run required E2E
        working-directory: web
        # The seeded E2E_* credentials are inherited from $GITHUB_ENV (written by
        # the seed step); do NOT re-map them here — an empty ${{ env.* }} at parse
        # time would overwrite the seeded values with blanks.
        env:
          E2E_REQUIRED: "1"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v || true
          supabase stop || true
