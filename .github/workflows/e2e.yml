# Required end-to-end job (M10 gate): runs Playwright against a fully seeded
# stack — Supabase auth + backend + worker + scheduler + web + Caddy — in
# REQUIRED mode (E2E_REQUIRED=1), so a missing/broken stack FAILS the job
# instead of silently skipping.
#
# Spec routing (web/e2e/routing.ts) is explicit:
# - job `e2e` runs every seeded-stack spec and never collects pilot-*.spec.ts;
# - job `pilot` runs ONLY pilot-*.spec.ts, through the isolated pytest harness
#   (tests/integration/test_pilot_browser.py). That harness provides the
#   controlled planner provider, dedicated worker and mock Slack transport.
#
# Both jobs fail rather than skip: `pilot` rejects a run in which nothing was
# collected or any test was skipped (scripts/ci/check_pilot_browser_run.py).
#
# NOTE: third-party actions should be pinned to immutable commit SHAs before
# go-live (ADR-018 policy); left on tags here for readability.

name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Required Playwright E2E (seeded stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 1) Local Supabase (GoTrue + Postgres) for real cookie auth. The CLI is
      #    PINNED for reproducible local-auth behavior (recent versions sign local
      #    user tokens asymmetrically — which is the production-target JWKS path).
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0
      - name: Start Supabase
        run: |
          supabase --version
          supabase init --force >/dev/null 2>&1 || true
          supabase start
          supabase status -o env | tee supabase.env
          API_URL="$(grep ^API_URL supabase.env | cut -d= -f2- | tr -d '\"')"
          # Export the values the stack + seed need.
          {
            echo "SUPABASE_API_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=$(grep ^ANON_KEY supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep ^SERVICE_ROLE_KEY supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_JWT_SECRET=$(grep ^JWT_SECRET supabase.env | cut -d= -f2- | tr -d '\"')"
            # Token `iss` is the host-side URL; JWKS must be fetched from the API
            # container via the host gateway (different host, same port).
            echo "SUPABASE_JWT_ISSUER=${API_URL}/auth/v1"
            echo "SUPABASE_JWKS_URL=http://host.docker.internal:54321/auth/v1/.well-known/jwks.json"
          } >> "$GITHUB_ENV"

      # 2) Bring up the stack in production migration order: datastores first,
      #    schema migrated, THEN runtime processes (so the scheduler never queries
      #    tables before they exist).
      - name: Build + start stack
        env:
          # Runtime public config for the web container (browser-safe). The image
          # is env-agnostic; the e2e overlay sets SUPABASE_SERVER_URL for the
          # container's own network path to the same local Supabase.
          SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          # JWKS-first verification (asymmetric); HS256 secret kept as fallback.
          SUPABASE_JWT_SECRET: ${{ env.SUPABASE_JWT_SECRET }}
          SUPABASE_JWKS_URL: ${{ env.SUPABASE_JWKS_URL }}
          SUPABASE_JWT_ISSUER: ${{ env.SUPABASE_JWT_ISSUER }}
          WORKSPACE_COOKIE_SECRET: e2e-workspace-cookie-secret-please-change
          # Pre-provisioned tenant-scoped worker secret is injected via the
          # seed-provisioned worker.secrets.env (see seed step output).
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.e2e.yml"
          # a) datastores only
          $COMPOSE up -d postgres redis
          # b) wait for Postgres readiness
          for i in $(seq 1 60); do
            $COMPOSE exec -T postgres pg_isready -U nlw -d nlw && break; sleep 2;
          done
          # c0) signed-context TEST key FILES must exist before the first
          #     `compose run api` — on Linux, Docker would otherwise auto-create the
          #     bind-mount sources as root-owned directories.
          scripts/ops/ctx-keys-dev.sh --generate-only -f docker-compose.yml -f docker-compose.e2e.yml
          # c) schema first — migrate before any runtime process starts
          $COMPOSE run --rm api alembic upgrade head
          # c2) signed-context keys (P3B): install the throwaway TEST keys with the
          #     owner credential BEFORE any runtime starts; each runtime then signs
          #     with ITS mounted key file (fail closed otherwise).
          scripts/ops/ctx-keys-dev.sh -f docker-compose.yml -f docker-compose.e2e.yml
          # d) now start the runtime processes
          $COMPOSE up -d --build api worker scheduler web caddy
          # e) wait for FastAPI readiness (Postgres + Redis + schema) BEFORE seeding.
          #    Use the loopback IPv4 literal to avoid ::1/localhost ambiguity in CI.
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::FastAPI did not become ready in time"
            $COMPOSE ps
            $COMPOSE logs api --tail=200
            exit 1
          fi
          # f) independently wait for the public frontend edge (Caddy -> Next).
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Frontend edge did not become ready in time"
            $COMPOSE ps
            $COMPOSE logs caddy web --tail=200
            exit 1
          fi

      # 2b) Prove the API container can reach the Supabase JWKS endpoint BEFORE
      #     seeding — surfaces asymmetric-verification connectivity problems here
      #     rather than as an opaque 401 from /me.
      - name: JWKS preflight (from API container)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.e2e.yml"
          if ! $COMPOSE exec -T api python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://host.docker.internal:54321/auth/v1/.well-known/jwks.json', timeout=5).status==200 else 1)"; then
            echo "::error::API container cannot reach the Supabase JWKS endpoint"
            $COMPOSE exec -T api python -c "import socket; print('host.docker.internal ->', socket.gethostbyname('host.docker.internal'))" || true
            $COMPOSE logs api --tail=100
            exit 1
          fi
          echo "JWKS reachable from the API container."

      # 3) Seed: two Supabase users, two workspaces, a member membership, and the
      #    tenant-scoped worker secret required by the connector.
      - name: Seed the stack
        id: seed
        env:
          SUPABASE_API_URL: ${{ env.SUPABASE_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          # Loopback IPv4 literal (not localhost) to avoid ::1/IPv6 ambiguity.
          NLW_API_BASE: http://127.0.0.1:8000
        # Write the synthetic E2E credentials to $GITHUB_ENV WITHOUT echoing them
        # to the workflow logs.
        run: node web/e2e/seed.mjs >> "$GITHUB_ENV"

      # 4) Run the required E2E suite through the public Caddy edge.
      - name: Install Playwright browsers
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Assert seeded-stack collection excludes harness-only specs
        working-directory: web
        env:
          E2E_REQUIRED: "1"
          E2E_BASE_URL: http://localhost:8080
        run: |
          npx playwright test --list > "$RUNNER_TEMP/seeded-e2e-list.txt"
          cat "$RUNNER_TEMP/seeded-e2e-list.txt"
          if grep -q "pilot-" "$RUNNER_TEMP/seeded-e2e-list.txt"; then
            echo "::error::seeded-stack E2E collected harness-only pilot specs (job 'pilot' runs them)"
            exit 1
          fi
          grep -Eq "^Total: [1-9][0-9]* tests? in" "$RUNNER_TEMP/seeded-e2e-list.txt"
      - name: Run required E2E
        working-directory: web
        # The seeded E2E_* credentials are inherited from $GITHUB_ENV (written by
        # the seed step); do NOT re-map them here — an empty ${{ env.* }} at parse
        # time would overwrite the seeded values with blanks.
        env:
          E2E_REQUIRED: "1"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v || true
          supabase stop || true

  pilot:
    name: Required pilot browser harness (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Private paths under the runner's temp dir (not the workspace). The
      # `runner` context is unavailable in job-level env, so export them here.
      - name: Define private harness paths
        run: |
          echo "PILOT_AUTH_WORKDIR=$RUNNER_TEMP/pilot-auth" >> "$GITHUB_ENV"
          echo "PILOT_AUTH_CONFIG=$RUNNER_TEMP/pilot-auth.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12"
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0

      - name: Install dependencies + build the production web app
        run: |
          uv sync --frozen
          cd web
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      # Disposable LOCAL auth only; the harness refuses non-loopback auth. The CLI
      # prints local keys on start, so output goes to a private file, never the log.
      - name: Start isolated local Supabase auth
        run: |
          umask 077
          supabase init --workdir "$PILOT_AUTH_WORKDIR" > /dev/null
          if ! supabase start --workdir "$PILOT_AUTH_WORKDIR" \
              --exclude studio,realtime,storage-api,imgproxy,postgres-meta,logflare,vector,edge-runtime,mailpit \
              > "$RUNNER_TEMP/pilot-auth-start.log" 2>&1; then
            grep -viE "key|secret|jwt|token|password" "$RUNNER_TEMP/pilot-auth-start.log" | tail -n 40
            echo "::error::local Supabase auth failed to start"
            exit 1
          fi
          supabase status --workdir "$PILOT_AUTH_WORKDIR" -o json > "$PILOT_AUTH_CONFIG"

      - name: Golden pilot journeys (Sales -> Slack proposal -> approval; Support)
        env:
          E2E_JSON_REPORT: ${{ runner.temp }}/pilot-golden-playwright.json
        run: |
          status=0
          uv run pytest tests/integration/test_pilot_browser.py -q --tb=short -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/pilot-golden-junit.xml" || status=$?
          uv run python scripts/ci/check_pilot_browser_run.py \
            --junit "$RUNNER_TEMP/pilot-golden-junit.xml" --playwright "$E2E_JSON_REPORT" || status=1
          exit "$status"

      - name: Failure / partial / UNKNOWN pilot journey
        env:
          PILOT_VISUAL_STATES: "1"
          E2E_JSON_REPORT: ${{ runner.temp }}/pilot-visual-playwright.json
        run: |
          status=0
          uv run python -m pytest tests/integration/test_pilot_browser.py \
            -p web.e2e.visual_states_plugin -q --tb=short -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/pilot-visual-junit.xml" || status=$?
          uv run python scripts/ci/check_pilot_browser_run.py \
            --junit "$RUNNER_TEMP/pilot-visual-junit.xml" --playwright "$E2E_JSON_REPORT" || status=1
          exit "$status"

      # Runs even after a failure. A Supabase that cannot be stopped fails the job.
      - name: Tear down local Supabase and credentials
        if: always()
        run: |
          rm -f "$PILOT_AUTH_CONFIG" "$RUNNER_TEMP/pilot-auth-start.log"
          if [ -d "$PILOT_AUTH_WORKDIR/supabase" ]; then
            supabase stop --workdir "$PILOT_AUTH_WORKDIR" --no-backup
          fi
          rm -rf "$PILOT_AUTH_WORKDIR"
          left="$(docker ps -aq --filter name=supabase_)"
          if [ -n "$left" ]; then
            echo "::error::local Supabase containers survived teardown"
            docker ps -a --filter name=supabase_ --format '{{.Names}} {{.Status}}'
            exit 1
          fi
