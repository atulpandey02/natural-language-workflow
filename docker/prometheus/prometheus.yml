# M11 staging observability: scrape each process's INTERNAL metrics port.
# All three roles bind metrics on :9100 in their own container (nlw.observability).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Backup / DR dead-man + failure alerts (M11.5 P2, ADR-022). Fed by the
# node_exporter textfile the backup job writes; requires a node_exporter scrape
# target with --collector.textfile.directory pointed at the metrics dir.
rule_files:
  - alerts/backup.rules.yml
  # Signed DB context self-check alerts (M11.5 P3B, ADR-024): sustained
  # key-mismatch / rotation / deployment failures only, never per-request noise.
  - alerts/signed-context.rules.yml

scrape_configs:
  - job_name: nlw-api
    static_configs:
      - targets: ["api:9100"]
        labels: { role: api }
  - job_name: nlw-worker
    static_configs:
      - targets: ["worker:9100"]
        labels: { role: worker }
  - job_name: nlw-scheduler
    static_configs:
      - targets: ["scheduler:9100"]
        labels: { role: scheduler }
