# M11 staging observability: scrape each process's INTERNAL metrics port.
# All three roles bind metrics on :9100 in their own container (nlw.observability).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Backup / DR dead-man + failure alerts (M11.5 P2, ADR-022). Fed by the
# textfile the backup job writes (nlw_backup.prom in the `backup_textfile`
# volume), served by the textfile-only `node-exporter` scraped below.
# Alertmanager is the internal `alertmanager` service (docker-compose.staging.yml);
# it ships with a null receiver until an operator wires a real channel
# (docs/ops/alerting.md). Unreachable Alertmanager only logs errors here.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Rule files are mounted READ-ONLY from ./docker/prometheus/alerts (the staging
# overlay mounts the whole directory; CI validates every referenced file exists).
rule_files:
  - alerts/backup.rules.yml
  # Signed DB context self-check alerts (M11.5 P3B, ADR-024): sustained
  # key-mismatch / rotation / deployment failures only, never per-request noise.
  - alerts/signed-context.rules.yml

scrape_configs:
  - job_name: nlw-api
    static_configs:
      - targets: ["api:9100"]
        labels: { role: api }
  - job_name: nlw-worker
    static_configs:
      - targets: ["worker:9100"]
        labels: { role: worker }
  - job_name: nlw-scheduler
    static_configs:
      - targets: ["scheduler:9100"]
        labels: { role: scheduler }
  # The backup job's freshness/success series (nlw_backup_*). Without this
  # target the NlwBackupStale dead-man only ever sees an ABSENT series and fires
  # permanently (ADR-022 amendment 1).
  - job_name: nlw-backup
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { role: backup }
