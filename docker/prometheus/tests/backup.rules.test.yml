# promtool unit tests for the backup dead-man (ADR-022 amendment 1).
# Run by tests/integration/test_monitoring_config.py with promtool from the
# pinned Prometheus image:
#   promtool test rules /etc/prometheus/tests/backup.rules.test.yml
#
# In promtool, time() is the evaluation offset in seconds, so a series whose
# value tracks the clock models a fresh backup, and a constant 0 models a
# backup that never advanced.
rule_files:
  - ../alerts/backup.rules.yml

evaluation_interval: 1m

tests:
  # Fresh: the textfile is scraped and the last verified backup keeps up with
  # the clock -> the dead-man stays silent, even well past 26h of wall time.
  - interval: 1m
    input_series:
      - series: 'nlw_backup_last_success_timestamp_seconds{job="nlw-backup", role="backup"}'
        values: '0+60x1800'
    alert_rule_test:
      - eval_time: 20m
        alertname: NlwBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: NlwBackupStale
        exp_alerts: []

  # Stale: the series is present but the last verified backup is older than the
  # 26h budget -> condition true from 26h, firing after the 15m `for`.
  - interval: 1m
    input_series:
      - series: 'nlw_backup_last_success_timestamp_seconds{job="nlw-backup", role="backup"}'
        values: '0x1800'
    alert_rule_test:
      - eval_time: 25h
        alertname: NlwBackupStale
        exp_alerts: []
      - eval_time: 26h10m
        alertname: NlwBackupStale
        exp_alerts: []
      - eval_time: 26h20m
        alertname: NlwBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: backup
              job: nlw-backup
              role: backup
            exp_annotations:
              summary: "No verified off-host backup in >26h (or metric missing)"
              description: "The last verified off-host backup is older than the freshness budget, or the backup metric series is absent (the systemd timer may have stopped, or node_exporter lost the textfile). Recovery point is eroding. Runbook: docs/runbooks/backup-failure-troubleshooting.md\n"

  # Absent: the series is missing entirely (no textfile scraped) -> fires after
  # the 15m `for`. This is the state staging was in before the exporter existed.
  - interval: 1m
    input_series:
      - series: 'up{job="nlw-api"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: NlwBackupStale
        exp_alerts: []
      - eval_time: 20m
        alertname: NlwBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: backup
            exp_annotations:
              summary: "No verified off-host backup in >26h (or metric missing)"
              description: "The last verified off-host backup is older than the freshness budget, or the backup metric series is absent (the systemd timer may have stopped, or node_exporter lost the textfile). Recovery point is eroding. Runbook: docs/runbooks/backup-failure-troubleshooting.md\n"

  # Recovery: absent, then the textfile appears with a fresh backup -> the
  # dead-man that was firing clears.
  - interval: 1m
    input_series:
      - series: 'nlw_backup_last_success_timestamp_seconds{job="nlw-backup", role="backup"}'
        values: '_x30 1800+60x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: NlwBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: backup
            exp_annotations:
              summary: "No verified off-host backup in >26h (or metric missing)"
              description: "The last verified off-host backup is older than the freshness budget, or the backup metric series is absent (the systemd timer may have stopped, or node_exporter lost the textfile). Recovery point is eroding. Runbook: docs/runbooks/backup-failure-troubleshooting.md\n"
      - eval_time: 40m
        alertname: NlwBackupStale
        exp_alerts: []
