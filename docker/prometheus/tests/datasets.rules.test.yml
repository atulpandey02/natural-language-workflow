# promtool unit tests for the dataset processing alerts (ADR-032).
# Run by tests/integration/test_monitoring_config.py:
#   promtool test rules /etc/prometheus/tests/datasets.rules.test.yml
rule_files:
  - ../alerts/datasets.rules.yml

evaluation_interval: 1m

tests:
  # Healthy: requests are picked up within minutes -> silent.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_dispatch_oldest_pending_age_seconds{role="ingest-dispatch"}'
        values: '0 60 120 0 30 0x60'
      - series: 'nlw_dataset_dispatch_stale{role="ingest-dispatch"}'
        values: '0x60'
      - series: 'nlw_dataset_dispatch_last_success_timestamp_seconds{role="ingest-dispatch"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: NlwDatasetProcessingPendingTooLong
        exp_alerts: []
      - eval_time: 60m
        alertname: NlwDatasetProcessingRequestsExpired
        exp_alerts: []
      - eval_time: 60m
        alertname: NlwDatasetDispatcherStalled
        exp_alerts: []

  # A request keeps waiting: over 900 s from minute 16, firing after the 5m `for`.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_dispatch_oldest_pending_age_seconds{role="ingest-dispatch"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: NlwDatasetProcessingPendingTooLong
        exp_alerts: []
      - eval_time: 22m
        alertname: NlwDatasetProcessingPendingTooLong
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: ingest-dispatch }
            exp_annotations:
              summary: "A dataset upload has waited over 15 minutes for processing"
              description: "The oldest waiting processing request is over 15 minutes old. Check the ingest runtime, Redis and the recovery lock. Runbook: docs/adr/ADR-032-dataset-ingest-dispatcher.md\n"

  # Requests too old to re-send, sustained for 15 minutes.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_dispatch_stale{role="ingest-dispatch"}'
        values: '0 2x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: NlwDatasetProcessingRequestsExpired
        exp_alerts: []
      - eval_time: 20m
        alertname: NlwDatasetProcessingRequestsExpired
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: ingest-dispatch }
            exp_annotations:
              summary: "Dataset processing requests are too old to be re-sent"
              description: "Waiting versions need an admin re-dispatch (POST .../process). Runbook: docs/adr/ADR-032-dataset-ingest-dispatcher.md\n"

  # The dispatcher stops completing cycles at minute 5 -> fires 10m + 5m later.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_dispatch_last_success_timestamp_seconds{role="ingest-dispatch"}'
        values: '0 60 120 180 240 300 300x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: NlwDatasetDispatcherStalled
        exp_alerts: []
      - eval_time: 22m
        alertname: NlwDatasetDispatcherStalled
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: ingest-dispatch }
            exp_annotations:
              summary: "The dataset dispatcher has not completed a cycle for 10 minutes"
              description: "Database, Redis or recovery-lock trouble. Runbook: docs/adr/ADR-032-dataset-ingest-dispatcher.md\n"

  # Rejected objects retained: silent within 7 days, firing past it.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_rejected_oldest_age_seconds{role="backup"}'
        values: '0+60x11000'
    alert_rule_test:
      - eval_time: 160h
        alertname: NlwDatasetRejectedRetainedTooLong
        exp_alerts: []
      - eval_time: 171h
        alertname: NlwDatasetRejectedRetainedTooLong
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: backup }
            exp_annotations:
              summary: "A rejected dataset object has been retained for over 7 days"
              description: "Run the operator's retention-sweep (bounded, dry-run first). Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"

  # Inactive versions: 30 days (2592000 s) crossed at ~34 m, firing after 24 h.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_inactive_oldest_age_seconds{role="backup"}'
        values: '2590000+60x1600'
    alert_rule_test:
      - eval_time: 30m
        alertname: NlwDatasetInactiveRetainedTooLong
        exp_alerts: []
      - eval_time: 24h
        alertname: NlwDatasetInactiveRetainedTooLong
        exp_alerts: []  # pending since ~34 m, `for: 24h` not yet elapsed
      - eval_time: 25h
        alertname: NlwDatasetInactiveRetainedTooLong
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: backup }
            exp_annotations:
              summary: "An unpublished or superseded dataset version is older than 30 days"
              description: "Run the operator's retention-sweep. Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"

  # Deletion not purged: 7 days (604800 s) crossed at 80 m, firing after 1 h.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_deleting_oldest_unpurged_age_seconds{role="backup"}'
        values: '600000+60x200'
    alert_rule_test:
      - eval_time: 79m
        alertname: NlwDatasetDeletedNotPurged
        exp_alerts: []
      - eval_time: 130m
        alertname: NlwDatasetDeletedNotPurged
        exp_alerts: []  # pending
      - eval_time: 150m
        alertname: NlwDatasetDeletedNotPurged
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: backup }
            exp_annotations:
              summary: "A dataset deletion request has not been purged within 7 days"
              description: "Run the operator's retention-sweep (or purge). Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"

  # Receipts: an unverified receipt from 11 m fires after 15 m; the expiring
  # warning from 11 m fires after 1 h.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_receipts_unverified{role="backup"}'
        values: '0x10 1x90'
      - series: 'nlw_dataset_receipts_expiring_untombstoned{role="backup"}'
        values: '0x10 1x90'
    alert_rule_test:
      - eval_time: 10m
        alertname: NlwDatasetReceiptsUnverified
        exp_alerts: []
      - eval_time: 20m
        alertname: NlwDatasetReceiptsUnverified
        exp_alerts: []  # pending
      - eval_time: 30m
        alertname: NlwDatasetReceiptsUnverified
        exp_alerts:
          - exp_labels: { severity: critical, component: datasets, role: backup }
            exp_annotations:
              summary: "A dataset deletion receipt is missing or does not verify"
              description: "Run reconcile-receipts and investigate before any tombstone. Runbook: docs/runbooks/deletion-receipt-log-provisioning.md\n"
      - eval_time: 60m
        alertname: NlwDatasetReceiptsExpiringBeforeTombstone
        exp_alerts: []  # pending
      - eval_time: 80m
        alertname: NlwDatasetReceiptsExpiringBeforeTombstone
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: backup }
            exp_annotations:
              summary: "A deletion receipt expires within 30 days but its version is not tombstoned"
              description: "Tombstone the version while its receipt is still retained. Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"

  # Sweep failed from 11 m: firing after 30 m.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_retention_sweep_failed{role="backup"}'
        values: '0x10 1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: NlwDatasetRetentionSweepFailed
        exp_alerts: []
      - eval_time: 45m
        alertname: NlwDatasetRetentionSweepFailed
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: backup }
            exp_annotations:
              summary: "The dataset retention sweep failed"
              description: "Re-run retention-sweep; it is idempotent and resumes from the oldest item. Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"

  # Sweep stale, ABSENT: no last-success metric at all is pending at once and
  # fires after the 30 m `for` (labels: only the rule's own).
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_rejected_retained{role="backup"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts: []  # pending
      - eval_time: 31m
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets }
            exp_annotations:
              summary: "The dataset retention sweep has not succeeded for 36 hours"
              description: "Check the sweep's schedule and its last result (a recovery lock also stops it). Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"

  # Sweep stale, FRESH: a success every minute (the gauge tracks time()) never fires.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_retention_sweep_last_success_timestamp_seconds{role="backup"}'
        values: '0+60x2400'
    alert_rule_test:
      - eval_time: 37h
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts: []

  # Sweep stale, RECOVERY: stale and firing at 37 h; a success at 37 h 01 m
  # (the gauge jumps to the current time) resolves it.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_retention_sweep_last_success_timestamp_seconds{role="backup"}'
        values: '0x2220 133260+60x100'
    alert_rule_test:
      - eval_time: 37h
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: backup }
            exp_annotations:
              summary: "The dataset retention sweep has not succeeded for 36 hours"
              description: "Check the sweep's schedule and its last result (a recovery lock also stops it). Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"
      - eval_time: 37h05m
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts: []

  # Sweep stale, STALE: the last success is t=0, so the age is time(); past 36 h
  # (129600 s) it is pending, firing after 30 m.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_retention_sweep_last_success_timestamp_seconds{role="backup"}'
        values: '0x2400'
    alert_rule_test:
      - eval_time: 36h
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts: []
      - eval_time: 36h20m
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts: []  # pending
      - eval_time: 37h
        alertname: NlwDatasetRetentionSweepStale
        exp_alerts:
          - exp_labels: { severity: warning, component: datasets, role: backup }
            exp_annotations:
              summary: "The dataset retention sweep has not succeeded for 36 hours"
              description: "Check the sweep's schedule and its last result (a recovery lock also stops it). Policy: docs/adr/ADR-035-phase2-retention-policy.md\n"

  # Credentials: the gauge is the ABSOLUTE expiry (here t=3000 s, i.e. 50 m)
  # and is never re-read (the refresher stopped; the process makes no S3 call).
  # time() advances anyway: silent while > 15 m remain, pending from 35 m,
  # firing after the 5 m `for`, and still firing once the expiry has passed.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_s3_credentials_expiry_timestamp_seconds{role="api"}'
        values: '3000x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: NlwDatasetS3CredentialsExpiring
        exp_alerts: []
      - eval_time: 38m
        alertname: NlwDatasetS3CredentialsExpiring
        exp_alerts: []  # pending (35 m), not yet firing
      - eval_time: 41m
        alertname: NlwDatasetS3CredentialsExpiring
        exp_alerts:
          - exp_labels: { severity: critical, component: datasets, role: api }
            exp_annotations:
              summary: "Dataset S3 credentials are about to expire"
              description: "The credential refresher is not rotating the per-container files. Runbook: docs/runbooks/dataset-s3-provisioning.md\n"
      - eval_time: 70m
        alertname: NlwDatasetS3CredentialsExpiring
        exp_alerts:
          - exp_labels: { severity: critical, component: datasets, role: api }
            exp_annotations:
              summary: "Dataset S3 credentials are about to expire"
              description: "The credential refresher is not rotating the per-container files. Runbook: docs/runbooks/dataset-s3-provisioning.md\n"

  # Rotation: the refresher writes a later expiry (9000 s) at 45 m; the next
  # read records it and the alert clears.
  - interval: 1m
    input_series:
      - series: 'nlw_dataset_s3_credentials_expiry_timestamp_seconds{role="ingest"}'
        values: '3000x44 9000x40'
    alert_rule_test:
      - eval_time: 42m
        alertname: NlwDatasetS3CredentialsExpiring
        exp_alerts:
          - exp_labels: { severity: critical, component: datasets, role: ingest }
            exp_annotations:
              summary: "Dataset S3 credentials are about to expire"
              description: "The credential refresher is not rotating the per-container files. Runbook: docs/runbooks/dataset-s3-provisioning.md\n"
      - eval_time: 46m
        alertname: NlwDatasetS3CredentialsExpiring
        exp_alerts: []
