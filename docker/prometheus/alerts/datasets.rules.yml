# Dataset processing alerts (ADR-032, owner decision O-7).
#
# Fed by the dataset dispatcher's aggregate gauges (nlw_dataset_dispatch_*):
# counts and ages over ALL workspaces, never per workspace, dataset or version.
#
# NOT referenced by prometheus.yml yet, and no scrape target exists for the
# dispatcher: uploads are disabled in staging and production. Wiring this file
# and the `ingest-dispatch` target into the deployed monitoring is part of
# owner decision O-6 (enablement). CI validates and unit-tests it with promtool.
groups:
  - name: nlw-datasets
    rules:
      # A committed processing request has waited more than 15 minutes: the
      # dispatcher re-sends lost enqueues within minutes, so this means the
      # ingest runtime is down, saturated or refusing work (e.g. the recovery
      # lock), or the queue is unreachable.
      - alert: NlwDatasetProcessingPendingTooLong
        expr: nlw_dataset_dispatch_oldest_pending_age_seconds > 900
        for: 5m
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "A dataset upload has waited over 15 minutes for processing"
          description: >
            The oldest waiting processing request is over 15 minutes old. Check
            the ingest runtime, Redis and the recovery lock. Runbook:
            docs/adr/ADR-032-dataset-ingest-dispatcher.md

      # Requests too old for the consumer cannot be re-sent unattended; an
      # admin must re-dispatch (POST .../process) to record a fresh request.
      - alert: NlwDatasetProcessingRequestsExpired
        expr: nlw_dataset_dispatch_stale > 0
        for: 15m
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "Dataset processing requests are too old to be re-sent"
          description: >
            Waiting versions need an admin re-dispatch (POST .../process). Runbook:
            docs/adr/ADR-032-dataset-ingest-dispatcher.md

      # The dispatcher is running (its series exists) but has not completed a
      # cycle for 10 minutes: lost enqueues are no longer being recovered.
      - alert: NlwDatasetDispatcherStalled
        expr: time() - nlw_dataset_dispatch_last_success_timestamp_seconds > 600
        for: 5m
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "The dataset dispatcher has not completed a cycle for 10 minutes"
          description: >
            Database, Redis or recovery-lock trouble. Runbook:
            docs/adr/ADR-032-dataset-ingest-dispatcher.md

      # O-5 (ADR-035): a rejected object is purged within 7 days (a target).
      # Fed by the operator's `retention-sweep` / `rejected-pending` textfile.
      - alert: NlwDatasetRejectedRetainedTooLong
        expr: nlw_dataset_rejected_oldest_age_seconds > 604800
        for: 1h
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "A rejected dataset object has been retained for over 7 days"
          description: >
            Run the operator's retention-sweep (bounded, dry-run first). Policy:
            docs/adr/ADR-035-phase2-retention-policy.md

      # O-5: an unpublished or superseded version is kept 30 days, then the daily
      # retention-sweep removes it; past 30 days for a full day, the sweep is not
      # keeping up.
      - alert: NlwDatasetInactiveRetainedTooLong
        expr: nlw_dataset_inactive_oldest_age_seconds > 2592000
        for: 24h
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "An unpublished or superseded dataset version is older than 30 days"
          description: >
            Run the operator's retention-sweep. Policy:
            docs/adr/ADR-035-phase2-retention-policy.md

      # O-5: logically deleted bytes are purged within 7 days (a target).
      - alert: NlwDatasetDeletedNotPurged
        expr: nlw_dataset_deleting_oldest_unpurged_age_seconds > 604800
        for: 1h
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "A dataset deletion request has not been purged within 7 days"
          description: >
            Run the operator's retention-sweep (or purge). Policy:
            docs/adr/ADR-035-phase2-retention-policy.md

      # ADR-034/O-5: a purge event whose receipt is missing, unretained or does
      # not verify. Fed by `reconcile-receipts --metrics-file`.
      - alert: NlwDatasetReceiptsUnverified
        expr: nlw_dataset_receipts_unverified > 0
        for: 15m
        labels: { severity: critical, component: datasets }
        annotations:
          summary: "A dataset deletion receipt is missing or does not verify"
          description: >
            Run reconcile-receipts and investigate before any tombstone. Runbook:
            docs/runbooks/deletion-receipt-log-provisioning.md

      # O-5: receipts are retained 365 days; a version still awaiting its
      # tombstone needs its receipt, so flag 30 days before the retention ends.
      - alert: NlwDatasetReceiptsExpiringBeforeTombstone
        expr: nlw_dataset_receipts_expiring_untombstoned > 0
        for: 1h
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "A deletion receipt expires within 30 days but its version is not tombstoned"
          description: >
            Tombstone the version while its receipt is still retained. Policy:
            docs/adr/ADR-035-phase2-retention-policy.md

      # O-5: the retention sweep reported a failure.
      - alert: NlwDatasetRetentionSweepFailed
        expr: nlw_dataset_retention_sweep_failed == 1
        for: 30m
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "The dataset retention sweep failed"
          description: >
            Re-run retention-sweep; it is idempotent and resumes from the oldest
            item. Policy: docs/adr/ADR-035-phase2-retention-policy.md

      # O-5: the daily retention sweep has not succeeded for 36 hours.
      - alert: NlwDatasetRetentionSweepStale
        expr: time() - nlw_dataset_retention_sweep_last_success_timestamp_seconds > 129600
        for: 30m
        labels: { severity: warning, component: datasets }
        annotations:
          summary: "The dataset retention sweep has not succeeded for 36 hours"
          description: >
            Check the sweep's schedule and its last result (a recovery lock also
            stops it). Policy: docs/adr/ADR-035-phase2-retention-policy.md

      # ADR-033 D3: the pinned S3 credentials of an API or ingest process expire
      # within 15 minutes, so the host refresher has stopped rotating them. The
      # gauge is the ABSOLUTE expiry time: compared with time(), it keeps
      # counting down even when the process never re-reads the file.
      - alert: NlwDatasetS3CredentialsExpiring
        expr: nlw_dataset_s3_credentials_expiry_timestamp_seconds - time() < 900
        for: 5m
        labels: { severity: critical, component: datasets }
        annotations:
          summary: "Dataset S3 credentials are about to expire"
          description: >
            The credential refresher is not rotating the per-container files.
            Runbook: docs/runbooks/dataset-s3-provisioning.md
