# Operator Alertmanager configuration — EXAMPLE (Slack incoming webhook).
# Copy to the host as /opt/nlw/alertmanager/alertmanager.yml (root:root 0644,
# OUTSIDE every release checkout). The webhook URL is a credential: it goes
# into /opt/nlw/alertmanager.secrets/slack.url (root:65534 0640, one line) and is
# referenced with `api_url_file` — never inline. The rollout refuses inline
# credentials, a null default receiver and credential paths outside
# /etc/alertmanager/secrets/.
global:
  resolve_timeout: 5m

route:
  receiver: ops-slack
  group_by: ["alertname", "component", "role"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ["severity = critical"]
      receiver: ops-slack
      repeat_interval: 1h

receivers:
  # Kept for `amtool` experiments only; never the default route.
  - name: "null"
  - name: ops-slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack.url
        channel: "#nlw-ops"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'

inhibit_rules:
  - source_matchers: ["severity = critical"]
    target_matchers: ["severity = warning"]
    equal: ["alertname", "role"]
