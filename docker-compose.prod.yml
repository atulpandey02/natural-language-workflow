# Production topology (M9, ADR-018): single-VPS Docker Compose.
#
# Public ingress is ONLY the Caddy reverse proxy (HTTPS). Everything else —
# api, worker, scheduler, postgres, redis, and every metrics port — is reachable
# only on the internal Docker network and is never published to the host.
#
# The application image is pinned to an immutable GHCR digest via NLW_IMAGE
# (staging and production run the EXACT same digest). Migrations are run as a
# one-off via the dedicated `migrate` service (the ONLY holder of the privileged
# owner credential) before switching traffic:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml \
#     -f docker-compose.staging.yml --profile migration run --rm migrate
#
# Required env (e.g. a git-ignored .env.prod):
#   NLW_IMAGE               ghcr.io/<owner>/nlw@sha256:...
#   PUBLIC_HOSTNAME         the DNS name Caddy serves (also the TrustedHost)
#   DATABASE_URL            (nlw_app; api)   WORKER_/SCHEDULER_DATABASE_URL
#   DATABASE_MIGRATION_URL  (owner; migrate service ONLY)  REDIS_URL
#   SUPABASE_URL            (JWKS verification)
#   NLW_LLM_API_KEY         (api only)
#   POSTGRES_PASSWORD  WORKSPACE_COOKIE_SECRET  NLW_*_DB_PASSWORD

x-app-env: &app-env
  APP_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: ${DATABASE_URL}
  # NOTE: DATABASE_MIGRATION_URL (the privileged owner credential) is intentionally
  # NOT here. Long-running runtime services (api/worker/scheduler) must never hold
  # a credential that can change schema/grants/RLS. Migrations run in the dedicated
  # one-shot `migrate` service (profile: migration) only. (M11.5 P0.)
  REDIS_URL: ${REDIS_URL}
  SUPABASE_URL: ${SUPABASE_URL}
  # Asymmetric (JWKS) verification is the production/target auth path. Passed
  # through explicitly so the token issuer (host-side) and the JWKS endpoint
  # (which may be an internal host) are configured independently.
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
  SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
  # The API is internal-only (M10): the browser never calls it — the frontend's
  # BFF does, over the internal network with Host "api". So the TrustedHost
  # allowlist is the internal service name + loopback (used by the healthcheck).
  # No public forwarded headers are trusted.
  TRUSTED_HOSTS: '["api","localhost","127.0.0.1"]'
  TRUSTED_PROXY_IPS: "[]"
  # Rate limits are config-driven so a capacity phase can raise them and a
  # rate-limit phase can restore normal values.
  RATE_LIMIT_PLANS_PER_MIN: ${RATE_LIMIT_PLANS_PER_MIN:-20}
  RATE_LIMIT_WRITES_PER_MIN: ${RATE_LIMIT_WRITES_PER_MIN:-60}

x-app-hardening: &app-hardening
  image: ${NLW_IMAGE:?set NLW_IMAGE to the GHCR image digest}
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256
  networks:
    - internal

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # The ONLY publicly published service. Proxies to the frontend; the API,
    # worker, scheduler, Postgres, Redis and all metrics ports stay internal.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
    depends_on:
      - web
    networks:
      - internal

  web:
    image: ${NLW_WEB_IMAGE:?set NLW_WEB_IMAGE to the frontend GHCR image digest}
    restart: unless-stopped
    # Internal only — reachable by Caddy on the internal network.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NLW_API_URL: http://api:8000
      # Runtime public config (browser-safe; injected into the document by the
      # Next server). Supplied at runtime so this ONE immutable image serves any
      # Supabase project. SUPABASE_SERVER_URL optionally overrides only the
      # server-side network path to the SAME project.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVER_URL: ${SUPABASE_SERVER_URL:-}
      # Required in production: signs the workspace-selection cookie. No silent
      # dev fallback — a missing value fails the prod render/start.
      WORKSPACE_COOKIE_SECRET: ${WORKSPACE_COOKIE_SECRET:?WORKSPACE_COOKIE_SECRET is required}
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      - api
    networks:
      - internal

  api:
    <<: *app-hardening
    environment:
      <<: *app-env
      # Planner runs API-side ONLY. The LLM provider/model/key live here (never in
      # x-app-env), so worker/scheduler/web never receive the platform LLM key.
      NLW_LLM_PROVIDER: ${NLW_LLM_PROVIDER:-stub}
      NLW_LLM_MODEL: ${NLW_LLM_MODEL:-claude-haiku-4-5-20251001}
      NLW_LLM_API_KEY: ${NLW_LLM_API_KEY:-}
    # No host port: reachable only by the frontend BFF on the internal network.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app-hardening
    command: ["dramatiq", "nlw.worker.actors", "--processes", "2", "--threads", "4"]
    # Give in-flight actions (bounded ~15s) time to finish on stop/redeploy so a
    # SIGKILL mid-send doesn't orphan a delivery. This REDUCES avoidable duplicate
    # sends on shutdown; it does NOT provide exactly-once delivery (external
    # effects still require receiver-side idempotency — ADR-013).
    stop_grace_period: 60s
    # Connector secrets are injected HERE only, via a git-ignored env_file.
    env_file:
      - path: docker/worker.secrets.env
        required: false
    environment:
      <<: *app-env
      # Required: the worker connects as its OWN least-privilege role. No silent
      # fallback to the app role — a missing value fails the prod render/start.
      DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required (nlw_worker)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nlw.ops.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    <<: *app-hardening
    command: ["python", "-m", "nlw.scheduler"]
    environment:
      <<: *app-env
      # Required: the scheduler connects as its OWN least-privilege role. No
      # silent fallback to the app role — missing value fails the render/start.
      DATABASE_URL: ${SCHEDULER_DATABASE_URL:?SCHEDULER_DATABASE_URL is required (nlw_scheduler)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nlw.ops.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot migration runner (M11.5 P0). The ONLY service that receives the
  # privileged owner credential (DATABASE_MIGRATION_URL). Gated behind the
  # `migration` profile so it never runs as a long-lived service; it runs
  # `alembic upgrade head` and exits. Same immutable image as the app; NO ports,
  # NO connector secrets, NO LLM key, NO Supabase keys.
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml \
  #     -f docker-compose.staging.yml --profile migration run --rm migrate
  migrate:
    image: ${NLW_IMAGE:?set NLW_IMAGE to the GHCR image digest}
    profiles: ["migration"]
    # Fail fast at RUNTIME (not render) if the owner credential wasn't injected.
    # $$ escapes Compose interpolation so the CONTAINER shell evaluates it — this
    # way a normal runtime `up` (which excludes this profiled service) never needs
    # DATABASE_MIGRATION_URL defined at all; it is injected only for migration.
    command: ["sh", "-c", ': "$${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required (migrate service)}"; exec alembic upgrade head']
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    mem_limit: 256m
    pids_limit: 128
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nlw
      # Required: production must never start with a weak/empty owner password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: nlw
      # Required strong passwords for the restricted runtime roles, consumed by
      # docker/postgres/initdb/00-roles.sh on FRESH-volume init only. A prod
      # render/start FAILS if any are absent (no weak fallback). Rotating these
      # later does NOT change an existing role's password (ALTER ROLE runbook).
      NLW_APP_DB_PASSWORD: ${NLW_APP_DB_PASSWORD:?NLW_APP_DB_PASSWORD is required}
      NLW_WORKER_DB_PASSWORD: ${NLW_WORKER_DB_PASSWORD:?NLW_WORKER_DB_PASSWORD is required}
      NLW_SCHEDULER_DB_PASSWORD: ${NLW_SCHEDULER_DB_PASSWORD:?NLW_SCHEDULER_DB_PASSWORD is required}
    # Internal only — no published port.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlw -d nlw"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7
    restart: unless-stopped
    # Internal only — no published port.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # --- Disaster recovery (M11.5 P2, ADR-022) ---
  # One-shot, profile-gated jobs that NEVER run on a normal `up`. Backup/restore
  # credentials (RESTIC_*, object-storage keys, the privileged backup/restore DB
  # URLs) are injected HERE ONLY and are DELIBERATELY absent from x-app-env, so the
  # api/worker/scheduler/web/migrate services can never inherit them.
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml \
  #     --profile backup run --rm backup
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
      args:
        NLW_IMAGE: ${NLW_IMAGE:?set NLW_IMAGE}
    image: ${NLW_BACKUP_IMAGE:-nlw-backup:local}
    profiles: ["backup"]
    command: ["backup"]
    # NOTE: the DR vars below use empty defaults (${VAR:-}), NOT compose ${VAR:?}
    # requireds. `docker compose config` interpolates EVERY service regardless of the
    # active profile, so a bare `:?` here would force unrelated renders (migration,
    # normal runtime) to supply backup/restore secrets. Fail-closed is enforced
    # authoritatively in Python: BackupSettings/RestoreSettings raise in
    # staging/production when a required secret is missing (see nlw.backup.config).
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-}
      NLW_BACKUP_DATABASE_URL: ${NLW_BACKUP_DATABASE_URL:-}
      NLW_BACKUP_METRICS_FILE: /textfile/nlw_backup.prom
      NLW_BACKUP_RETENTION_DAILY: ${NLW_BACKUP_RETENTION_DAILY:-14}
      NLW_BACKUP_RETENTION_WEEKLY: ${NLW_BACKUP_RETENTION_WEEKLY:-8}
      NLW_BACKUP_RETENTION_MONTHLY: ${NLW_BACKUP_RETENTION_MONTHLY:-6}
      NLW_BACKUP_MAX_AGE_HOURS: ${NLW_BACKUP_MAX_AGE_HOURS:-26}
      # Retention mode: "simple" (job prunes) | "immutable" (job NEVER prunes; a
      # separate admin process does). See docs/ops/backup-providers.md.
      NLW_BACKUP_RETENTION_MODE: ${NLW_BACKUP_RETENTION_MODE:-simple}
      # (A) single-execution lock on a SHARED runtime volume so two backup CONTAINERS
      # (manual + timer) contend for the same flock — not just two threads.
      NLW_BACKUP_LOCK_FILE: /run/nlw/backup.lock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    mem_limit: 512m
    pids_limit: 256
    networks:
      - internal
    volumes:
      # Host-readable node_exporter textfile directory (see G / systemd guide).
      - backup_textfile:/textfile
      # Shared, writable lock dir (rootfs is read-only) — the cross-container flock.
      - backup_run:/run/nlw
    depends_on:
      postgres:
        condition: service_healthy

  # Restore is intended for a NEW / disposable host. It refuses an active or
  # non-empty target and requires NLW_RESTORE_CONFIRM == NLW_RESTORE_TARGET_ID.
  # Restore object-storage credentials are SEPARATE from the backup writer's.
  #   docker compose --env-file .env.restore -f docker-compose.prod.yml \
  #     --profile restore run --rm restore
  restore:
    image: ${NLW_BACKUP_IMAGE:-nlw-backup:local}
    profiles: ["restore"]
    command: ["restore"]
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${RESTORE_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RESTORE_AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-}
      NLW_RESTORE_DATABASE_URL: ${NLW_RESTORE_DATABASE_URL:-}
      NLW_RESTORE_SNAPSHOT: ${NLW_RESTORE_SNAPSHOT:-latest}
      NLW_RESTORE_TARGET_ID: ${NLW_RESTORE_TARGET_ID:-}
      NLW_RESTORE_CONFIRM: ${NLW_RESTORE_CONFIRM:-}
      REDIS_URL: ${RESTORE_REDIS_URL:-}
      # (B) runtime-state guard, scoped to THIS exact Compose project. Required in
      # production. The container needs docker access (mount the socket read-only) to
      # run the compose probe, OR run the host preflight in dr-fresh-host-restore.md.
      NLW_RESTORE_COMPOSE_PROJECT: ${NLW_RESTORE_COMPOSE_PROJECT:-}
      NLW_RESTORE_RUNTIME_GUARD: ${NLW_RESTORE_RUNTIME_GUARD:-compose}
      # (C) restore-ready gate written atomically after quiescence+validation, onto a
      # shared volume the recovered runtime reads via `nlw.backup gate-check`.
      NLW_RESTORE_GATE_FILE: /var/lib/nlw/restore-ready.json
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    mem_limit: 512m
    pids_limit: 256
    networks:
      # Network isolation from the runtime is achieved by running restore in a
      # SEPARATE Compose project on a FRESH host (see dr-fresh-host-restore.md),
      # where api/worker/scheduler/web are not defined and cannot attach — not by a
      # sub-network here (the restore target shares this project's postgres).
      - internal
    volumes:
      - restore_gate:/var/lib/nlw
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backup_textfile:
  backup_run:
  restore_gate:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
