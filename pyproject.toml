[project]
name = "nlw"
version = "0.0.0"
description = "Natural Language Workflow Platform — production, self-hostable AI workflow engine."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.7.0",
    "dramatiq[redis]>=2.2.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlglot>=30.18.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "testcontainers[postgres,redis]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlw"]

# ---------------------------------------------------------------------------
# Ruff: formatter + linter (replaces black + isort + flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic migrations commonly import op/sa without using both.
"migrations/versions/*" = ["F401"]

# ---------------------------------------------------------------------------
# mypy: standard everywhere, strict on the invariant-heavy modules.
# Deterministic safety logic (domain/feasibility/engine) must be fully typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
files = ["src", "tests"]
explicit_package_bases = true
namespace_packages = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nlw.domain.*", "nlw.feasibility.*", "nlw.engine.*", "nlw.planner.*"]
strict = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external services (Postgres/Redis) via testcontainers",
]

