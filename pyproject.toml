[project]
name = "nlw"
version = "0.0.0"
description = "Natural Language Workflow Platform — production, self-hostable AI workflow engine."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlw"]

# ---------------------------------------------------------------------------
# Ruff: formatter + linter (replaces black + isort + flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy: standard everywhere, strict on the invariant-heavy modules.
# Deterministic safety logic (domain/feasibility/engine) must be fully typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
files = ["src", "tests"]
explicit_package_bases = true
namespace_packages = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nlw.domain.*", "nlw.feasibility.*", "nlw.engine.*"]
strict = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

